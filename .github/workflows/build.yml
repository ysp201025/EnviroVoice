name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          echo "✅ Checking project structure..."
          test -f index.html   && echo "  ✔ index.html"   || (echo "  ✘ index.html missing" && exit 1)
          test -f script.js    && echo "  ✔ script.js"    || (echo "  ✘ script.js missing"  && exit 1)
          test -f style.css    && echo "  ✔ style.css"    || (echo "  ✘ style.css missing"  && exit 1)
          test -f colorMode.js && echo "  ✔ colorMode.js" || (echo "  ✘ colorMode.js missing" && exit 1)
          test -f img/icon.png && echo "  ✔ img/icon.png" || (echo "  ✘ icon.png missing"   && exit 1)
          echo "All required files present."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
